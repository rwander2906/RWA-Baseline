name: Bug
description: Fehler mit reproduzierbarem Verhalten
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Fehlerbild
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regressionstest
      description: Wie wird der ursprüngliche Fehler automatisiert abgesichert?
