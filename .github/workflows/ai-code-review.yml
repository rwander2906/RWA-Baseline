name: AI Code Review

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER || 'fake' }}
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'baseline-test' }}
      AI_REVIEW_MODE: ${{ vars.AI_REVIEW_MODE || 'advisory' }}
      AI_REVIEW_OUTAGE: ${{ vars.AI_REVIEW_OUTAGE || 'fail-open' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(python -c "import os,re; m=re.search(r'(?:Refs|Closes|Fixes)\\s+#(\\d+)',os.environ.get('PR_BODY',''),re.I); print(m.group(1) if m else '')")
          test -n "$ISSUE" || { echo "PR must reference an Issue using Refs #N"; exit 1; }
          gh api "repos/${{ github.repository }}/issues/$ISSUE" > issue.json
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > pr.diff
          python scripts/build_ai_review_package.py --event "$GITHUB_EVENT_PATH" --issue issue.json --diff pr.diff --rules rules/baseline-1.1.json --context docs/PROJECT_GUIDELINES.md --context docs/ARCHITECTURE.md --output ai-review-package.json
      - name: Run provider-neutral review harness
        run: python scripts/ai_review_harness.py ai-review-package.json --provider "$AI_REVIEW_PROVIDER" --model "$AI_REVIEW_MODEL" --output ai-review-result.json
      - name: Publish review result and apply policy
        if: always()
        run: |
          test -f ai-review-result.json || { echo "AI review produced no result" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          python scripts/render_ai_review.py ai-review-result.json --summary "$GITHUB_STEP_SUMMARY"
          python scripts/ai_review_policy.py ai-review-result.json --mode "$AI_REVIEW_MODE" --outage "$AI_REVIEW_OUTAGE" --output ai-review-decision.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-code-review-${{ github.event.pull_request.number }}
          path: |
            ai-review-package.json
            ai-review-result.json
            ai-review-decision.json
          if-no-files-found: ignore
          retention-days: 14
