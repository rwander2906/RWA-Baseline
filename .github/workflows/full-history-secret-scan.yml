name: Full Git History Secret Scan
on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/full-history-secret-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all reachable history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Publication audit tracked in issue #58. Re-run on changes to this workflow.
      - name: Run Gitleaks on full reachable history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro"             ghcr.io/gitleaks/gitleaks:v8.24.3             git /repo --redact --verbose --exit-code 1

      - name: Explain scan scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Git history secret scan"
            echo ""
            echo "Gitleaks checked reachable Git history with full-depth checkout."
            echo "This scan does not cover unreachable/pruned objects, GitHub issue/PR text or attachments."
            echo "Check the job result before changing repository visibility."
          } >> "$GITHUB_STEP_SUMMARY"
