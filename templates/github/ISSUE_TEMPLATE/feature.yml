name: Feature
about: Neue oder geänderte Funktion
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests / Smoke-Tests
